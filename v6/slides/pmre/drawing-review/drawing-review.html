<!doctype html><html><meta charset="utf-8"><style>html,body{margin:0;background:#141110;color:#eee2cf;font-family:Arial;height:100%;overflow:hidden}h1{position:absolute;left:5%;top:5%;font-size:7vh;margin:0}svg{position:absolute;left:4%;top:22%;width:92%;height:62%}text{fill:#cbbda5;font-size:25px}.sheet{fill:#201b19;stroke:#796b54;stroke-width:2}.ink{fill:none;stroke:#cbbda5;stroke-width:3}.mark{fill:none;stroke:#e8b95b;stroke-width:7;stroke-linecap:round}.review{opacity:0}p{position:absolute;left:5%;bottom:7%;font-size:4vh;margin:0;color:#d7b668}</style><h1 id="title"></h1><svg viewBox="0 0 1600 620" aria-label="One model produces plans, sections, elevations and schedules; review finds the stair headroom error"><defs><g id="section"><path class="ink" d="M15 205H280M35 205V75L145 15L260 75V205M35 120H260M35 130H260M60 205V185H85V165H110V145H135V125H160V105"/><rect class="ink" x="190" y="145" width="35" height="60"/></g><g id="plan"><rect class="ink" x="25" y="25" width="230" height="175"/><path class="ink" d="M120 25V135M25 135H200M175 135V200M205 25V95H120M40 150H100M40 160H100M40 170H100M40 180H100M40 190H100"/></g></defs><g id="sheets"></g><g class="review"><ellipse class="mark" cx="530" cy="165" rx="66" ry="43"/><path class="mark" d="M590 205L710 330"/><rect x="695" y="325" width="850" height="125" rx="12" fill="#141110"/><text x="710" y="365" style="fill:#e8b95b;font-size:35px">The stair meets the slab</text><text x="710" y="413" style="fill:#e8b95b;font-size:35px">Who checks the headroom?</text></g></svg><p id="line"></p><script src="../../sd-frame.js"></script><script>const P=SDFrame.props({review:false});document.getElementById('title').textContent=P.review?'Your eye is the bottleneck':'A few decisions. A lot of drawings.';document.getElementById('line').textContent=P.review?'Great preparation for reviewing AI output':'Plans, sections, elevations and schedules become byproducts';const svgNS='http://www.w3.org/2000/svg',host=document.getElementById('sheets');['PLAN','SECTION','ELEVATION','SCHEDULE','ROOF PLAN','CROSS SECTION','DETAIL','AREA SCHEDULE'].forEach((name,i)=>{const g=document.createElementNS(svgNS,'g');g.setAttribute('transform',`translate(${i%4*400},${Math.floor(i/4)*310})`);g.innerHTML=`<rect class="sheet" x="0" y="0" width="375" height="285"/><text x="22" y="264">${name}</text>`;if(i%4===3){for(let n=0;n<6;n++)g.innerHTML+=`<path class="ink" d="M25 ${35+n*30}H340M150 35V215M250 35V215"/>`;}else g.innerHTML+=`<use href="#${i%4===0?'plan':'section'}" transform="translate(35 15)"/>`;host.append(g);g.animate([{opacity:0,transform:`translate(${i%4*400}px,${Math.floor(i/4)*310+30}px)`},{opacity:1,transform:`translate(${i%4*400}px,${Math.floor(i/4)*310}px)`}],{duration:500,delay:i*220,fill:'both'});});if(P.review)document.querySelector('.review').animate([{opacity:0},{opacity:1}],{duration:500,delay:2300,fill:'both'});SDFrame.init({duration:5,steps:0});</script></html>
