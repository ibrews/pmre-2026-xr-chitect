<!doctype html><html lang="en"><meta charset="utf-8"><title>Seat sightlines to a balcony actor</title><style>html,body{margin:0;width:100%;height:100%;background:#060810;color:#f0f4ff;font-family:Arial,sans-serif;overflow:hidden}svg{width:100%;height:100%}text{fill:#f0f4ff} .chair{fill:none;stroke:#aeb9cd;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.ray{fill:none;stroke:#00d4ff;stroke-width:2;opacity:.7} .label{font-size:26px;letter-spacing:3px}</style><svg viewBox="0 0 1920 1080" aria-label="Original illustrative theater section: seat outlines and eye points converge on an actor standing on a balcony"><text x="960" y="170" text-anchor="middle" font-size="52" font-weight="700">Can every seat see the actor?</text><g stroke="#596479" stroke-width="4" fill="none"><path d="M260 850H500V815H660V780H820V745H980V710H1140V675H1250"/><path d="M1300 490H1690V520H1300Z" fill="#202b3e"/><path d="M1320 490V435H1680V490M1340 435V490M1370 435V490M1400 435V490M1430 435V490M1460 435V490M1490 435V490M1520 435V490M1550 435V490M1580 435V490M1610 435V490M1640 435V490"/></g><g id="rays"></g><g id="chairs"></g><g id="actor" stroke="#f59e0b" stroke-width="8" fill="none" stroke-linecap="round"><circle cx="1490" cy="335" r="18" fill="#f59e0b"/><path d="M1490 357V419M1490 375L1458 400M1490 375L1525 386M1490 419L1470 486M1490 419L1515 486"/></g><text x="1490" y="285" text-anchor="middle" class="label">BALCONY ACTOR</text><text x="680" y="910" text-anchor="middle" class="label">SEAT OUTLINES</text></svg><script src="../../sd-frame.js"></script><script>
