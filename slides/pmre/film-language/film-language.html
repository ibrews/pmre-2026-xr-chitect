<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Film language / a young medium</title><style>
h1{text-wrap:balance}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#141110;color:#eee2cf;font-family:'Avenir Next',Arial,sans-serif}svg{width:100%;height:100%}.beat{opacity:0}.frame{fill:#201b19;stroke:#bf9d67;stroke-width:3}.line{fill:none;stroke:#cbbda5;stroke-width:5;stroke-linecap:round}text{fill:#eee2cf;font-size:42px}h1{position:absolute;left:9%;top:4%;font-size:56px;font-weight:600;margin:0}.date{fill:#c5a577;font-size:28px}.person{fill:#cbbda5}.small{font-size:30px;fill:#b8a58b}
</style></head><body><h1>VR is still a new medium</h1><svg viewBox="0 0 1920 1080" aria-label="A schematic stage moves from one static shot to cuts, close-ups, time jumps, expressive angles and montage"><defs>
<g id="actor"><circle class="person" cy="-95" r="27"/><path class="person" d="M-31-60Q0-77 31-60L58 15Q61 35 42 34L22-14L24 95Q20 112 4 101L0 36L-7 101Q-23 113-28 96L-24-15L-45 34Q-63 39-60 17Z"/></g>
<g id="set"><path class="line" d="M450 650H1470M510 650V340H1410V650"/><rect x="1030" y="470" width="170" height="180" fill="#49392a"/><use id="performer" href="#actor" transform="translate(800 540)"/><use href="#actor" transform="translate(1260 540)"/></g>
<clipPath id="crop"><rect x="390" y="270" width="1140" height="460"/></clipPath><clipPath id="balcony-crop"><rect x="390" y="220" width="1140" height="470"/></clipPath></defs>
<g class="beat"><rect class="frame" x="390" y="270" width="1140" height="460"/><use href="#set"/><text x="390" y="825">One camera. One action.</text></g>
<g class="beat"><rect class="frame" x="390" y="270" width="1140" height="460"/><g clip-path="url(#crop)"><use id="reverse" href="#set" transform="translate(1920 0) scale(-1 1)"/></g><text x="390" y="825">The cut changes our point of view</text></g>
<g class="beat"><rect class="frame" x="390" y="270" width="1140" height="460"/><g clip-path="url(#crop)"><use href="#actor" transform="translate(960 830) scale(3.7)"/></g><text x="390" y="825">A close-up changes what we feel</text></g>
<g class="beat"><rect class="frame" x="390" y="270" width="1140" height="460"/><use href="#set"/><circle cx="1310" cy="370" r="38" fill="#c5a577"/><text x="490" y="400" style="font-size:68px">The next day</text><text x="390" y="825">A cut can cross time</text></g>
<g class="beat"><rect class="frame" x="390" y="270" width="1140" height="460"/><g clip-path="url(#crop)"><use href="#set" transform="rotate(-12 960 500)"/></g><text x="390" y="825">The frame can make us uneasy</text></g>
<g class="beat"><rect class="frame" x="390" y="270" width="1140" height="460"/><path class="line" d="M770 270V730M1150 270V730"/><use href="#actor" transform="translate(570 560)"/><path class="line" d="M820 650L1090 370M850 650H1090M875 610H1090M920 565H1090M965 520H1090M1010 475H1090"/><use href="#actor" transform="translate(1340 530) scale(1.2)"/><text x="390" y="825">Meaning between images</text></g>
<g class="beat"><rect class="frame" x="390" y="220" width="1140" height="470"/><text x="960" y="290" text-anchor="middle" class="small">THE BALCONY</text><g clip-path="url(#balcony-crop)"><use id="balcony-wide" href="#set" transform="translate(0 -60)"/><use id="balcony-close" href="#actor" transform="translate(960 600) scale(2.8)" opacity="0"/></g><g id="audience"></g><text x="960" y="1015" text-anchor="middle" style="font-size:46px">An audience watches the cuts together</text></g>
<g class="beat"><text x="960" y="450" text-anchor="middle" style="font-size:76px">What can only VR say?</text><text x="960" y="555" text-anchor="middle" class="small">Space. Presence. A story we experience together.</text></g>
</svg><script src="../../sd-frame.js"></script><script>
const beats=[...document.querySelectorAll('.beat')],END=36;
beats.forEach((g,i)=>{const start=i/8,end=(i+1)/8;const k=[{opacity:i===0?1:0,offset:0}];if(i>0)k.push({opacity:0,offset:start-.00001},{opacity:1,offset:start});if(i<7)k.push({opacity:1,offset:end-.00001},{opacity:0,offset:end});k.push({opacity:i===7?1:0,offset:1});g.animate(k,{duration:END*1000,fill:'both'});});
// Within the cut beat, the reverse angle arrives on a hard edit.
document.querySelector('#reverse').animate([{transform:'translate(0px,0px)',offset:0},{transform:'translate(0px,0px)',offset:.2},{transform:'translate(1920px,0px) scale(-1,1)',offset:.20001},{transform:'translate(1920px,0px) scale(-1,1)',offset:1}],{duration:END*1000,fill:'both'});
document.querySelector('#performer').animate([{transform:'translate(760px,540px)',offset:0},{transform:'translate(930px,540px)',offset:1/7},{transform:'translate(930px,540px)',offset:1}],{duration:END*1000,fill:'both'});
window.MOTION_SFX=[{t:4,kind:'snap'},{t:5.6,kind:'snap'},{t:12,kind:'snap'},{t:20,kind:'snap'},{t:20.18,kind:'snap',gain:.5},{t:20.36,kind:'snap',gain:.4}];
const NS='http://www.w3.org/2000/svg',aud=document.getElementById('audience');
for(let row=0;row<2;row++)for(let col=0;col<9;col++){const g=document.createElementNS(NS,'g');g.setAttribute('transform',`translate(${455+col*126} ${790+row*115}) scale(.45)`);g.innerHTML='<rect x="-47" y="-10" width="94" height="130" rx="18" fill="#483b34"/><use href="#actor"/>';aud.append(g);}
for(const [id,invert] of [['balcony-wide',false],['balcony-close',true]])document.getElementById(id).animate([{opacity:invert?0:1,offset:0},{opacity:invert?0:1,offset:.79},{opacity:invert?1:0,offset:.79001},{opacity:invert?1:0,offset:.84},{opacity:invert?0:1,offset:.84001},{opacity:invert?0:1,offset:1}],{duration:END*1000,fill:'both'});
SDFrame.init({duration:END,steps:0, onEnter(){parent.postMessage({sdMotionSfx:window.MOTION_SFX},'*');}});
</script></body></html>
