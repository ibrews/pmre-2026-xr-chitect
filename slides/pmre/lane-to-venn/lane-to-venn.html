<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lane to Venn (sprite) — motion</title>
<!-- Spatial Deck slide module pmre/lane-to-venn (slides/pmre/lane-to-venn/); ported unchanged from media/motion/lane-to-venn.html @310afba.
     PMRE 2026 motion graphic, option "lanemotion:lanevenn". The lane plays with 2010 pixel Alex walking it; the road splits into
     architecture, theater and technology; then the three strands curl up into the three Venn circles (path morph: every strand
     and circle is M + 5 cubic segments, so CSS `d` interpolates). He lands on the XR-CHITECT center and gets the headset.
     Overlap labels are venn.html's VERIFIED chapters. Where `d` can't animate (Safari), the strands fade into the circles
     instead, so the final frame is identical. WAAPI + CSS only; ?static / reduced-motion = final frame; ?t=N seeks. -->
<style>
:root{--bg:#060810;--text:#f0f4ff;--dim:rgba(240,244,255,.45)}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:'Space Grotesk','Inter','Avenir Next','Helvetica Neue',system-ui,sans-serif}
svg{width:100%;height:100%;display:block}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--d,2s) cubic-bezier(.3,0,.3,1) var(--t,0s) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fade{opacity:0;animation:fade .9s ease var(--t,0s) forwards}
@keyframes fade{to{opacity:1}}
.fadeout{animation:fadeout .8s ease var(--t,0s) forwards}
@keyframes fadeout{to{opacity:0}}
.rise{opacity:0;transform:translateY(24px);animation:rise 1s cubic-bezier(.2,.8,.2,1) var(--t,0s) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop 1s cubic-bezier(.2,1.4,.4,1) var(--t) forwards}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.lane-dash{stroke-dasharray:28 22;animation:march 1.2s linear 0s 4 forwards}
@keyframes march{to{stroke-dashoffset:-50}}
.label{fill:var(--dim);font-size:26px;letter-spacing:.32em;font-weight:500}
.big{fill:var(--text);font-size:96px;font-weight:600;letter-spacing:-.01em}
.lbl{font-size:40px;font-weight:600;letter-spacing:.18em;fill:var(--text)}
.ov{font-size:27px;font-weight:500;fill:var(--text);letter-spacing:.04em}
.halo{stroke:#060810;stroke-width:10px;stroke-linejoin:round;paint-order:stroke fill;stroke-opacity:.85}
.core{font-size:44px;font-weight:700;fill:#060810;letter-spacing:.06em}
.vc{mix-blend-mode:screen}
</style></head><body>
<svg id="s" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" aria-label="A pixel-art Alex walks one straight lane; it splits into architecture, theater and technology strands, which curl up into three overlapping circles: archviz, theater planning, live VR theater. He lands in the center, XR-chitect, and puts on a headset.">
<defs>
  <radialGradient id="ga"><stop offset="0" stop-color="#00d4ff" stop-opacity=".42"/><stop offset="1" stop-color="#00d4ff" stop-opacity=".1"/></radialGradient>
  <radialGradient id="gt"><stop offset="0" stop-color="#f43f5e" stop-opacity=".42"/><stop offset="1" stop-color="#f43f5e" stop-opacity=".1"/></radialGradient>
  <radialGradient id="gx"><stop offset="0" stop-color="#a78bfa" stop-opacity=".42"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".1"/></radialGradient>
  <linearGradient id="core" x1="0" x2="1"><stop offset="0" stop-color="#00d4ff"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
  <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<!-- Act 1: the single lane -->
<g class="fadeout" style="--t:4.8s">
  <line x1="120" y1="500" x2="1800" y2="500" stroke="rgba(240,244,255,.35)" stroke-width="3" class="draw" pathLength="1" style="--d:1.6s;--t:.2s"/>
  <line x1="120" y1="620" x2="1800" y2="620" stroke="rgba(240,244,255,.35)" stroke-width="3" class="draw" pathLength="1" style="--d:1.6s;--t:.35s"/>
  <line x1="120" y1="560" x2="1800" y2="560" stroke="rgba(240,244,255,.5)" stroke-width="4" class="lane-dash"/>
  <text x="960" y="380" text-anchor="middle" class="big rise" style="--t:1.6s">Pick a lane.</text>
  <text x="960" y="720" text-anchor="middle" class="label rise" style="--t:2.6s">STAY IN IT &#183; MASTER ONE CRAFT</text>
</g>
<!-- Venn fills (under the strands); they take over the strokes once the strands have curled -->
<g id="vc">
  <circle class="vc" cx="820" cy="450" r="300" fill="url(#ga)" stroke="#00d4ff" stroke-width="3"/>
  <circle class="vc" cx="1100" cy="450" r="300" fill="url(#gt)" stroke="#f43f5e" stroke-width="3"/>
  <circle class="vc" cx="960" cy="690" r="300" fill="url(#gx)" stroke="#a78bfa" stroke-width="3"/>
</g>
<!-- Act 2: three strands leave the lane, then curl into circles -->
<g id="strands" filter="url(#glow)" fill="none" stroke-linecap="round">
  <path id="sA" d="M120 560 C 280 560, 440 560, 600 560 C 700 560, 740 330, 860 330 C 980 330, 1100 700, 1300 700 C 1440 700, 1480 560, 1600 560 C 1600 560, 1600 560, 1600 560" stroke="#00d4ff" stroke-width="7" class="draw" pathLength="1" style="--d:2.6s;--t:4.9s"/>
  <path id="sT" d="M120 560 C 280 560, 440 560, 600 560 C 720 560, 900 820, 1060 820 C 1180 820, 1200 420, 1300 420 C 1440 420, 1480 560, 1600 560 C 1600 560, 1600 560, 1600 560" stroke="#f43f5e" stroke-width="7" class="draw" pathLength="1" style="--d:2.6s;--t:5.0s"/>
  <path id="sX" d="M120 560 C 280 560, 440 560, 600 560 C 700 560, 800 560, 900 560 C 1000 560, 1100 560, 1300 560 C 1440 560, 1480 560, 1600 560 C 1600 560, 1600 560, 1600 560" stroke="#a78bfa" stroke-width="7" class="draw" pathLength="1" style="--d:2.6s;--t:5.1s"/>
</g>
<g id="lanelabels">
  <text x="680" y="270" text-anchor="end" class="label halo fade" style="--t:6.4s;fill:#00d4ff">ARCHITECTURE</text>
  <text x="1060" y="900" text-anchor="middle" class="label halo fade" style="--t:6.6s;fill:#f43f5e">THEATER</text>
  <text x="1630" y="569" text-anchor="start" class="label halo fade" style="--t:6.8s;fill:#a78bfa">TECHNOLOGY</text>
</g>
<text x="500" y="300" text-anchor="end" class="lbl fade" style="--t:10.2s;fill:#00d4ff">ARCHITECTURE</text>
<text x="1420" y="300" text-anchor="start" class="lbl fade" style="--t:10.4s;fill:#f43f5e">THEATER</text>
<text x="960" y="1040" text-anchor="middle" class="lbl fade" style="--t:10.6s;fill:#a78bfa">TECHNOLOGY</text>
<text x="960" y="355" text-anchor="middle" class="ov halo fade" style="--t:11.4s">theater planning</text>
<text x="755" y="700" text-anchor="middle" class="ov halo fade" style="--t:11.7s">archviz</text>
<text x="1160" y="700" text-anchor="middle" class="ov halo fade" style="--t:12.0s">live VR theater</text>
<g class="pop" style="--t:10.5s">
  <rect x="790" y="508" width="340" height="76" rx="38" fill="url(#core)"/>
  <text x="960" y="560" text-anchor="middle" class="core">XR-CHITECT</text>
</g>
<g id="hero"></g>
<g id="fx"></g>
<text x="960" y="110" text-anchor="middle" class="big rise" style="--t:12.4s;font-size:84px">I didn&#8217;t.</text>
</svg>
<script src="../../kit/sprite.js"></script>
<script src="../../sd-frame.js"></script>
<script>
(function(){
const END=14.5, {track,clamp,ease}=PX, SC=2.0, M0=8.0, M1=10.0;
// The curl: hold each strand until M0, morph to its circle by M1.
const canD=window.CSS&&CSS.supports&&CSS.supports('d','path("M0 0")');
// Each circle = M + five 72-degree cubic arcs from 9 o'clock, clockwise: the same command list as a strand, so they interpolate.
function circ(cx,cy,r){const n=5,da=2*Math.PI/n,k=4/3*Math.tan(da/4)*r,P=a=>[cx+r*Math.cos(a),cy+r*Math.sin(a)],f=v=>v.toFixed(1);
  let a=Math.PI,p=P(a),d=`M${f(p[0])} ${f(p[1])}`;
  for(let i=0;i<n;i++){const b=a+da,q=P(b);d+=` C ${f(p[0]-k*Math.sin(a))} ${f(p[1]+k*Math.cos(a))}, ${f(q[0]+k*Math.sin(b))} ${f(q[1]-k*Math.cos(b))}, ${f(q[0])} ${f(q[1])}`;a=b;p=q;}
  return d;}
const TO={sA:circ(820,450,300),sT:circ(1100,450,300),sX:circ(960,690,300)};
['sA','sT','sX'].forEach((id,i)=>{const p=document.getElementById(id),a=`path("${p.getAttribute('d')}")`,b=`path("${TO[id]}")`;
  if(canD)p.animate([{d:a,offset:0},{d:a,offset:(M0+i*.12)/END,easing:'cubic-bezier(.5,0,.3,1)'},{d:b,offset:(M1+i*.12)/END},{d:b,offset:1}],{duration:END*1000,fill:'both'});});
// Strands hand off to the thin Venn strokes; lane labels leave as the curl starts.
track(document.getElementById('strands'),END,t=>({opacity:+(1-clamp((t-(canD?10.2:8.4))/.8,0,1)).toFixed(3)}));
track(document.getElementById('vc'),END,t=>({opacity:+clamp((t-9.4)/1.0,0,1).toFixed(3)}));
track(document.getElementById('lanelabels'),END,t=>({opacity:+(1-clamp((t-7.6)/.5,0,1)).toFixed(3)}));
const hero=PX.sprite(document.getElementById('hero'),{withBeard:false}), C=[960,508];
const hs=PX.headset(hero.body); track(hs,END,t=>({opacity:t>=11.1?1:0}),true);
const at=PX.route([
  {type:'idle',t0:0,t1:1.0,a:[200,560],face:1},
  {type:'walk',t0:1.0,t1:4.7,a:[200,560],b:[600,560],linear:true},
  {type:'idle',t0:4.7,t1:5.9,a:[600,560],cheer:true},
  {type:'path',t0:5.9,t1:7.6,path:document.getElementById('sX'),x0:600,x1:960},   // rides the technology strand
  {type:'hop',t0:7.9,t1:9.3,a:[960,560],b:[960,560],h:220},                       // the ground curls up under him
  {type:'idle',t0:9.3,t1:10.2,a:[960,560]},
  {type:'hop',t0:10.2,t1:10.8,a:[960,560],b:C,h:90},                               // onto the XR-CHITECT pill
  {type:'idle',t0:10.8,t1:END,a:C,face:1}
]);
PX.drive(hero,END,at,SC,[0.3,0.9]);
PX.sparkles(document.getElementById('fx'),END,960,470,10.9,31,1.3);
SDFrame.init({ duration: END, steps: 0 });
})();
</script>
</body></html>
