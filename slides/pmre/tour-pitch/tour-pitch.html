<script>
const {E,track,clamp}=PX,NS='http://www.w3.org/2000/svg';
// lon/lat -> this map's screen space, fitted to the fs-travels pins (Austin, Aspen, New York)
const P=(lon,lat)=>[1267.5+15.59*(lon+97.74),635-17.66*(lat-30.27)];
const C=[[-74.0,40.71],[-71.06,42.36],[-75.17,39.95],[-77.04,38.9],[-84.39,33.75],[-87.63,41.88],[-96.8,32.78],[-104.99,39.74],[-118.24,34.05],[-122.42,37.77],[-122.33,47.61]].map(c=>P(...c));
const T0=.8,HOP=.62,END=T0+HOP*C.length+1.6,pins=document.getElementById('pins');
C.forEach((c,i)=>{const at=T0+HOP*i+HOP*.85,g=E('g',{transform:`translate(${c[0].toFixed(1)} ${c[1].toFixed(1)})`},pins);
 const dot=E('g',{},g);E('rect',{x:-15,y:-34,width:30,height:30,fill:'#c5a577',rx:3},dot);E('rect',{x:-9,y:-26,width:6,height:6,fill:'#292421'},dot);E('rect',{x:3,y:-26,width:6,height:6,fill:'#292421'},dot);E('rect',{x:-4,y:-14,width:8,height:10,fill:'#292421'},dot);
 track(dot,END,t=>({opacity:t<T0+HOP*i?0:1}));
 const x=E('path',{d:'M-18 -52 L18 -16 M18 -52 L-18 -16',stroke:'#f43f5e','stroke-width':8,'stroke-linecap':'round',fill:'none'},g);
 track(x,END,t=>{const k=clamp((t-at)/.18,0,1);return{opacity:+k.toFixed(2),transform:`scale(${(1.6-.6*k).toFixed(3)})`};});});
const hero=PX.sprite(document.getElementById('hero'),{withBeard:false}),segs=[{type:'idle',t0:0,t1:T0,a:C[0],face:1}];
for(let i=1;i<C.length;i++)segs.push({type:'hop',t0:T0+HOP*(i-1)+HOP*.15,t1:T0+HOP*i,a:C[i-1],b:C[i],h:90});
segs.push({type:'idle',t0:T0+HOP*(C.length-1),t1:END+1,a:C[C.length-1],face:-1});
// stand just above each office pin
PX.drive(hero,END,(f=>t=>{const s=f(t);return{...s,y:s.y-40};})(PX.route(segs)),.8);
track(document.getElementById('sub'),END,t=>({opacity:+clamp((t-(END-1.4))/.6,0,1).toFixed(2)}));
window.MOTION_SFX=segs.filter(s=>s.type==='hop').map(s=>({t:s.t0,kind:'bounce',gain:.06}));
SDFrame.init({duration:END,steps:0,onEnter(){parent.postMessage({sdMotionSfx:window.MOTION_SFX},'*');}});
