<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bizarre Overlaps (sprite) — motion</title>
<!-- PMRE 2026 motion graphic, option "lanemotion:venn". A seekable port of the HarvardXR 2026 Venn slide: three crafts with
     their pixel icons (temple, proscenium, monitor-with-platformer) and 2010 pixel Alex bouncing between them; each icon reacts
     when he lands. As he crosses each overlap, its VERIFIED chapter label from venn.html appears (theater planning, live VR
     theater, archviz); he ends on the XR-CHITECT center pill. Built by venn-scene.js (shared with lane-traffic). WAAPI keyframes sampled from pure functions of time (sprite.js);
     ?static / reduced-motion = final frame; ?t=N seeks; window.seek(sec) for MP4 capture. -->
<style>
:root{--bg:#060810;--text:#f0f4ff;--dim:rgba(240,244,255,.5)}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:'Space Grotesk','Inter','Avenir Next','Helvetica Neue',system-ui,sans-serif}
svg{width:100%;height:100%;display:block}
.c{mix-blend-mode:screen;opacity:0;animation:in 1.6s cubic-bezier(.2,.8,.2,1) var(--t) forwards}
@keyframes in{from{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.8)}to{opacity:1;transform:none}}
.fade{opacity:0;animation:fade .9s ease var(--t,0s) forwards}
@keyframes fade{to{opacity:1}}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop 1s cubic-bezier(.2,1.4,.4,1) var(--t) forwards}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.lbl{font-size:40px;font-weight:600;letter-spacing:.18em;fill:var(--text)}
.ov{font-size:27px;font-weight:500;fill:var(--text);letter-spacing:.04em}
.halo{stroke:#060810;stroke-width:10px;stroke-linejoin:round;paint-order:stroke fill;stroke-opacity:.85}
.cap{font-size:30px;fill:var(--dim);letter-spacing:.3em}
.core{font-size:44px;font-weight:700;fill:#060810;letter-spacing:.06em}
</style></head><body>
<svg id="s" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" aria-label="Three overlapping circles, Architecture, Theater and Technology, each with a pixel icon. A pixel-art Alex hops from icon to icon; overlaps light up as theater planning, live VR theater and archviz; he ends standing on the XR-chitect center.">
<defs>
  <radialGradient id="ga"><stop offset="0" stop-color="#00d4ff" stop-opacity=".42"/><stop offset="1" stop-color="#00d4ff" stop-opacity=".1"/></radialGradient>
  <radialGradient id="gt"><stop offset="0" stop-color="#f43f5e" stop-opacity=".42"/><stop offset="1" stop-color="#f43f5e" stop-opacity=".1"/></radialGradient>
  <radialGradient id="gx"><stop offset="0" stop-color="#a78bfa" stop-opacity=".42"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".1"/></radialGradient>
  <linearGradient id="core" x1="0" x2="1"><stop offset="0" stop-color="#00d4ff"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
</defs>
</svg>
<script src="sprite.js"></script>
<script src="venn-scene.js"></script>
<script>
// The whole sequence lives in venn-scene.js so lane-traffic replays this exact timeline after its curl.
PX.vennScene(document.getElementById('s'),{END:PX.VENN_LEN,T0:0});window.MOTION_END=PX.VENN_LEN;
</script>
<script>
(function(){const P=new URLSearchParams(location.search),END=window.MOTION_END;
window.seek=function(s){document.getAnimations().forEach(a=>{a.pause();a.currentTime=s*1000;});};
if(matchMedia('(prefers-reduced-motion: reduce)').matches||P.has('static'))seek(END);else if(P.has('t'))seek(+P.get('t'));})();
</script>
<script src="look.js"></script>
</body></html>
