<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Hand — motion</title>
<!-- PMRE 2026 motion graphic: the "Taste" chapter. LEFT: a building section drawn by hand, one deliberate line at a time
     (slight wobble, varying weight), with a stack of sheets behind it ("× 1,000"). RIGHT: the same section generated
     instantly in crisp CAD lines, with one hidden error: the floor slab runs straight across the stair (no stair opening, no headroom). Then a hand-drawn
     amber critique circle finds it.
     VERIFIED (Alex in chat, 2026-10-21): no computers in first-year architecture at Syracuse, a thousand drawings by hand,
     "it's in your bones", Revit makes the sections "automagically". The building, the error and the layout are ILLUSTRATIVE.
     ?static / prefers-reduced-motion = final frame; window.seek(sec) is used for MP4 capture. -->
<style>
:root{--bg:#060810;--teal:#00d4ff;--amber:#f59e0b;--rose:#f43f5e;--text:#f0f4ff;--dim:rgba(240,244,255,.5);--graphite:#d9dbe3}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:'Space Grotesk','Inter','Avenir Next','Helvetica Neue',system-ui,sans-serif}
svg{width:100%;height:100%;display:block}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--d,.5s) cubic-bezier(.45,0,.55,1) var(--t,0s) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fade{opacity:0;animation:fade .7s ease var(--t,0s) forwards}
@keyframes fade{to{opacity:1}}
.snap{opacity:0;animation:snap .25s steps(1,end) var(--t,0s) forwards}
@keyframes snap{to{opacity:1}}
.cap{font-size:46px;font-weight:600;fill:var(--text)}
.tag{font-size:24px;letter-spacing:.28em;font-weight:600}
.small{font-size:22px;fill:var(--dim);letter-spacing:.16em}
</style></head><body>
<svg id="s" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" aria-label="Left: a building section drawn slowly by hand. Right: the same section generated instantly by software, with a stair that runs into the floor slab. A hand-drawn circle catches the error.">
<!-- sheets stack (the thousand drawings) -->
<g id="sheets"></g>
<g id="hand" fill="none" stroke="var(--graphite)" stroke-linecap="round" stroke-linejoin="round"></g>
<text x="500" y="150" text-anchor="middle" class="tag fade" style="--t:.4s;fill:var(--graphite)">BY HAND</text>
<text x="500" y="975" text-anchor="middle" class="small fade" style="--t:4.6s">ONE DELIBERATE LINE AT A TIME · × 1,000</text>
<!-- machine side -->
<g id="cad" fill="none" stroke="var(--teal)" stroke-width="2.5"></g>
<text x="1420" y="150" text-anchor="middle" class="tag snap" style="--t:5.6s;fill:var(--teal)">GENERATED</text>
<text x="1420" y="975" text-anchor="middle" class="small snap" style="--t:5.9s">EVERY SECTION, “AUTOMAGICALLY”</text>
<!-- critique -->
<path id="circle" fill="none" stroke="var(--amber)" stroke-width="7" stroke-linecap="round" class="draw" pathLength="1" style="--t:8.0s;--d:1.1s"/>
<text id="note" x="1610" y="640" text-anchor="middle" class="tag fade" style="--t:9.0s;fill:var(--amber);letter-spacing:.12em">NO HEADROOM</text>
<text x="960" y="1045" text-anchor="middle" class="cap fade" style="--t:10.0s">It’s in your bones.</text>
</svg>
<script>
(function(){
const NS='http://www.w3.org/2000/svg';
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
// building section in local coords (0..640 x 0..640): ground, walls, floors, roof, stair
// building section, local coords (0..640). Stair rises 600→420 in 5 steps (x 120→320).
const BASE=[ [0,600,640,600],[60,600,60,250],[580,600,580,250],[60,250,320,90],[580,250,320,90],
  [120,600,120,564],[120,564,160,564],[160,564,160,528],[160,528,200,528],[200,528,200,492],[200,492,240,492],
  [240,492,240,456],[240,456,280,456],[280,456,280,420],[280,420,320,420],
  [400,600,400,500],[460,600,460,500],[400,500,460,500],
  [400,350,520,350],[400,290,520,290],[400,290,400,350],[520,290,520,350] ];
// HAND: the slab leaves a stair opening (x 200..330) — the drawer thought about headroom.
const SLAB_HAND=[[60,420,200,420],[60,436,200,436],[330,420,580,420],[330,436,580,436],[200,420,200,436]];
// CAD: the slab runs straight across the stair — every section generated, nobody looked.
const SLAB_CAD=[[60,420,580,420],[60,436,580,436]];
const L=BASE.slice(0,5).concat(SLAB_HAND,BASE.slice(5));
function wob(x1,y1,x2,y2,amp){const n=6;let d=`M${x1} ${y1}`;for(let i=1;i<=n;i++){const t=i/n,x=x1+(x2-x1)*t,y=y1+(y2-y1)*t;
  const nx=-(y2-y1),ny=(x2-x1),len=Math.hypot(nx,ny)||1,o=(i<n?(rnd()-.5)*amp:0);d+=` L${(x+nx/len*o).toFixed(1)} ${(y+ny/len*o).toFixed(1)}`;}return d;}
// hand side: placed at x 180..820, y 260..900 ; strokes drawn sequentially 0.6s .. 4.4s
const H=document.getElementById('hand'),ox=180,oy=290,sc=1.0;
L.forEach((l,i)=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',wob(ox+l[0]*sc,oy+l[1]*sc,ox+l[2]*sc,oy+l[3]*sc,3.2));
  p.setAttribute('pathLength','1');p.setAttribute('class','draw');p.setAttribute('stroke-width',(2.2+rnd()*2.2).toFixed(1));
  p.style.setProperty('--t',(0.6+i*0.17).toFixed(2)+'s');p.style.setProperty('--d','.32s');H.appendChild(p);});
// sheets fanning behind the hand drawing
const SH=document.getElementById('sheets');
for(let i=0;i<9;i++){const r=document.createElementNS(NS,'rect');const a=-6+i*1.4;
  r.setAttribute('x',150);r.setAttribute('y',220);r.setAttribute('width',700);r.setAttribute('height',720);r.setAttribute('rx',6);
  r.setAttribute('fill','rgba(240,244,255,'+(0.006+i*0.002)+')');r.setAttribute('stroke','rgba(240,244,255,'+(0.10+i*0.02)+')');
  r.setAttribute('transform',`rotate(${a} 500 580)`);r.setAttribute('class','fade');r.style.setProperty('--t',(4.2+i*0.06).toFixed(2)+'s');SH.appendChild(r);}
SH.style.opacity='1';
// CAD side: same section, crisp, appears all at once; ERROR: stair continues up through the slab (no headroom)
const C=document.getElementById('cad'),cx=1100,cy=290;
const LC=BASE.slice(0,5).concat(SLAB_CAD,BASE.slice(5));
LC.forEach(l=>{const p=document.createElementNS(NS,'line');p.setAttribute('x1',cx+l[0]);p.setAttribute('y1',cy+l[1]);p.setAttribute('x2',cx+l[2]);p.setAttribute('y2',cy+l[3]);
  p.setAttribute('class','snap');p.style.setProperty('--t','5.6s');C.appendChild(p);});
// hand-drawn critique circle around the clash (stair top meets slab ~ x cx+300, y cy+410)
const ccx=cx+265,ccy=cy+438;let d='';for(let i=0;i<=40;i++){const a=-2.4+i/40*(Math.PI*2.15),r=86+Math.sin(i*1.7)*5;d+=(i?' L':'M')+(ccx+Math.cos(a)*r*1.25).toFixed(1)+' '+(ccy+Math.sin(a)*r).toFixed(1);}
document.getElementById('circle').setAttribute('d',d);
})();
(function(){const P=new URLSearchParams(location.search),END=12;window.MOTION_END=END;
window.seek=function(s){document.getAnimations().forEach(a=>{a.pause();a.currentTime=s*1000;});};
if(matchMedia('(prefers-reduced-motion: reduce)').matches||P.has('static'))seek(END);else if(P.has('t'))seek(+P.get('t'));})();
</script>
<script src="look.js"></script>
</body></html>
